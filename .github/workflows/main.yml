name: Android APK Build (Raftar Production)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install Project Dependencies
      run: npm install || npm install --legacy-peer-deps

    - name: Compile Relative Asset Production Bundle
      run: npm run build

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Initialize Missing Capacitor Native Android Layout
      run: |
        npm install @capacitor/cli @capacitor/android
        npx cap init "Raftar Mobility" "com.raftarmobility.app" --web-dir=dist || echo "Already initialized"
        npx cap add android || echo "Android layer already created"

    - name: Sync Native Capacitor 8 Resources
      run: npx cap sync android

    - name: Build Standalone Release APK via Gradle
      run: |
        cd android
        ./gradlew assembleDebug
        cd ..

    - name: Export Market-Grade APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RaftarMobility-Release-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
